# Bilan des simulations foot publiées (résultats FotMob) toutes les demi-heures : foot/bilan.json sur la branche
# resultats. Seuls comptent les pronos non risqués (prono mis en avant, combiné rattaché jugé sûr).
name: Bilan foot
on:
  schedule: [{ cron: '13,43 * * * *' }]
  workflow_dispatch:
concurrency: { group: bilan-foot, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  bilan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Calcul et publication
        run: |
          git config user.name "simbet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin resultats && git worktree add -B resultats ../res FETCH_HEAD
          mkdir -p ../res/foot
          for i in 1 2 3 4 5; do
            node src/cli/footbilan.ts ../res/foot
            git -C ../res add foot/bilan.json
            git -C ../res commit -qm "Bilan foot" || exit 0
            git -C ../res push origin HEAD:resultats && exit 0
            sleep $((i * 3))
            git -C ../res fetch origin resultats && git -C ../res reset -q --hard FETCH_HEAD
          done
          exit 1
