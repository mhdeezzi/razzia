# Vérifie si les serveurs GitHub Actions atteignent les sources de données (stats.nba.com et cdn.nba.com filtrent
# beaucoup d'IP de serveurs). Si tout passe, l'ingestion et les simulations quotidiennes peuvent tourner ici.
name: Accès aux sources
on:
  workflow_dispatch:
    inputs:
      script: { description: 'Sonde à lancer (src/dev/…)', default: 'probe.ts' }
      extra: { description: 'URL supplémentaires à tester (séparées par des espaces)', default: '' }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node "src/dev/${{ inputs.script || 'probe.ts' }}"
        env: { PROBE_EXTRA: "${{ inputs.extra }}" }
