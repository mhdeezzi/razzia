# Vérifie si les serveurs GitHub Actions atteignent les sources de données (stats.nba.com et cdn.nba.com filtrent
# beaucoup d'IP de serveurs). Si tout passe, l'ingestion et les simulations quotidiennes peuvent tourner ici.
name: Accès aux sources
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe-sources.yml', 'src/dev/probe.ts']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node src/dev/probe.ts
        env:
          # Requêtes supplémentaires dont on affiche le début de la réponse (diagnostic de la web app).
          PROBE_EXTRA: >-
            https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=20261021-20261027&limit=300
            https://simbet.vercel.app/api/games?days=7
            https://simbet-mhdeezzi.vercel.app/api/games?days=7
