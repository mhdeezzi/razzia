# Contrôle de justesse : rejoue des matchs passés avec les seules données disponibles avant chaque match et compare
# au résultat réel et au marché (Brier, bon vainqueur, calibration par tranche de confiance, portées 80 %).
# Variantes : chaque réglage du moteur tourne sur sa propre machine, sur les mêmes matchs, pour les comparer.
#   variants = {"actuel":{}, "momentum 30":{"momentumWeight":0.3}}
name: Contrôle de justesse
on:
  workflow_dispatch:
    inputs:
      from: { description: 'Premier jour (AAAA-MM-JJ)', default: '2026-01-10' }
      to: { description: 'Dernier jour (AAAA-MM-JJ)', default: '2026-04-12' }
      games: { description: 'Nombre de matchs', default: '120' }
      n: { description: 'Simulations par match', default: '600' }
      variants: { description: 'Variantes (JSON : nom -> paramètres du moteur)', default: '{"actuel":{}}' }
  push:
    paths: ['.github/workflows/backtest.yml', 'src/nba/**', 'src/cli/backtest.ts']
# Pushs : un seul contrôle en attente par branche. Lancements manuels : un groupe par période testée.
concurrency: { group: "backtest-${{ github.ref }}-${{ github.event_name }}-${{ inputs.from }}-${{ inputs.to }}", cancel-in-progress: false }
env:
  VARIANTS: ${{ inputs.variants || '{"actuel":{}}' }}
jobs:
  variantes:
    runs-on: ubuntu-latest
    outputs: { names: "${{ steps.v.outputs.names }}" }
    steps:
      - id: v
        run: echo "names=$(node -e 'console.log(JSON.stringify(Object.keys(JSON.parse(process.env.VARIANTS))))')" >> "$GITHUB_OUTPUT"
  backtest:
    needs: variantes
    name: "backtest (${{ matrix.variant }})"
    strategy:
      fail-fast: false
      matrix: { variant: "${{ fromJSON(needs.variantes.outputs.names) }}" }
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SIMLAB_OFFLINE_HOSTS: stats.nba.com
      FROM: ${{ inputs.from || '2026-01-10' }}
      TO: ${{ inputs.to || '2026-04-12' }}
      GAMES: ${{ inputs.games || '120' }}
      N: ${{ inputs.n || '600' }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: nba-cache-${{ github.run_id }}-${{ strategy.job-index }}
          restore-keys: nba-cache-
      - run: npm run snapshot -- --pull
      - run: npm run ingest -- --games
      - run: |
          PARAMS=$(node -e 'console.log(JSON.stringify(JSON.parse(process.env.VARIANTS)[process.env.VARIANT] ?? {}))')
          echo "Variante « $VARIANT » : $PARAMS"
          npm run backtest -- --from "$FROM" --to "$TO" --games "$GAMES" --n "$N" --params "$PARAMS" | tee backtest.txt
      - name: Résumé
        run: |
          { echo "### Variante : $VARIANT"; echo '```'; sed -n '/^Matchs :/,$p' backtest.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
