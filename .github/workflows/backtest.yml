# Contrôle de justesse : rejoue des matchs passés avec les seules données disponibles avant chaque match et compare
# au résultat réel et au marché (Brier, bon vainqueur, calibration par tranche de confiance, portées 80 %).
# Variantes : chaque réglage du moteur tourne sur sa propre machine, sur les mêmes matchs, pour les comparer.
#   variants = {"actuel":{}, "momentum 30":{"momentumWeight":0.3}}
name: Contrôle de justesse
on:
  workflow_dispatch:
    inputs:
      from: { description: 'Premier jour (AAAA-MM-JJ)', default: '2026-01-10' }
      to: { description: 'Dernier jour (AAAA-MM-JJ)', default: '2026-04-12' }
      games: { description: 'Nombre de matchs', default: '120' }
      n: { description: 'Simulations par match', default: '600' }
      variants: { description: 'Variantes (JSON : nom -> paramètres du moteur)', default: '{"actuel":{}}' }
      shards: { description: 'Morceaux parallèles par variante (1 match sur k chacun)', default: '1' }
# Lancements manuels uniquement (un groupe par période testée) : un contrôle coûte des heures de machine.
concurrency: { group: "backtest-${{ github.ref }}-${{ github.event_name }}-${{ inputs.from }}-${{ inputs.to }}", cancel-in-progress: false }
env:
  VARIANTS: ${{ inputs.variants || '{"actuel":{}}' }}
jobs:
  variantes:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    outputs: { names: "${{ steps.v.outputs.names }}", shards: "${{ steps.v.outputs.shards }}" }
    steps:
      - id: v
        env: { SHARDS: "${{ inputs.shards || '1' }}" }
        run: |
          echo "names=$(node -e 'console.log(JSON.stringify(Object.keys(JSON.parse(process.env.VARIANTS))))')" >> "$GITHUB_OUTPUT"
          echo "shards=$(node -e 'console.log(JSON.stringify([...Array(Math.max(1, Number(process.env.SHARDS))).keys()]))')" >> "$GITHUB_OUTPUT"
  backtest:
    needs: variantes
    name: "backtest (${{ matrix.variant }}) ${{ matrix.shard }}"
    strategy:
      fail-fast: false
      matrix: { variant: "${{ fromJSON(needs.variantes.outputs.names) }}", shard: "${{ fromJSON(needs.variantes.outputs.shards) }}" }
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    env:
      SIMLAB_OFFLINE_HOSTS: stats.nba.com
      FROM: ${{ inputs.from || '2026-01-10' }}
      TO: ${{ inputs.to || '2026-04-12' }}
      GAMES: ${{ inputs.games || '120' }}
      N: ${{ inputs.n || '600' }}
      VARIANT: ${{ matrix.variant }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ inputs.shards || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: nba-cache-${{ github.run_id }}-${{ strategy.job-index }}
          restore-keys: nba-cache-
      - run: npm run snapshot -- --pull
      - run: npm run ingest -- --games
      - run: |
          PARAMS=$(node -e 'console.log(JSON.stringify(JSON.parse(process.env.VARIANTS)[process.env.VARIANT] ?? {}))')
          echo "Variante « $VARIANT » : $PARAMS"
          npm run backtest -- --from "$FROM" --to "$TO" --games "$GAMES" --n "$N" --params "$PARAMS" --shard "$SHARD" --shards "$SHARDS" --json morceau.json | tee backtest.txt
      - name: Résumé
        run: |
          { echo "### Variante : $VARIANT"; echo '```'; sed -n '/^Matchs :/,$p' backtest.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: "morceau-${{ strategy.job-index }}", path: morceau.json, retention-days: 7 }
  synthese:
    needs: backtest
    if: always()
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions: { contents: write }
    env:
      FROM: ${{ inputs.from || '2026-01-10' }}
      TO: ${{ inputs.to || '2026-04-12' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/download-artifact@v4
        with: { path: morceaux, pattern: 'morceau-*' }
      - name: Référence par variante
        run: node src/cli/btmerge.ts morceaux | tee synthese.txt && cat synthese.txt >> "$GITHUB_STEP_SUMMARY"
      # Lignes match par match (moteur, marché, résultat) gardées dans la branche « controles » pour les autopsies.
      - name: Lignes du contrôle (branche controles)
        env: { GH_TOKEN: "${{ github.token }}", RUN: "${{ github.run_id }}" }
        run: |
          node -e 'const fs=require("fs"),p=require("path");const walk=d=>fs.readdirSync(d).flatMap(f=>{const q=p.join(d,f);return fs.statSync(q).isDirectory()?walk(q):q.endsWith(".json")?[q]:[]});const out=[];for(const f of walk("morceaux")){const j=JSON.parse(fs.readFileSync(f,"utf8"));for(const r of j.rows)out.push({variant:j.variant,...r})}fs.writeFileSync("lignes.json",JSON.stringify({from:process.env.FROM,to:process.env.TO,rows:out}))'
          mkdir ctl && cd ctl && git init -q && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin controles; then git checkout -q -b controles FETCH_HEAD; else git checkout -q --orphan controles; fi
          mkdir -p runs && cp ../lignes.json "runs/$RUN.json"
          git add runs && git -c user.name=razzia-bot -c user.email=actions@github.com commit -qm "Contrôle $RUN" && git push -q origin controles
