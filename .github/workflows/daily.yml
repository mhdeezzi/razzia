# Chaque jour : nouveaux matchs (cdn.nba.com), blessures (ESPN), cotes (DraftKings), puis 5 000 simulations par
# match de la soirée, publiées dans site-data/ (Vercel redéploie au push). stats.nba.com bloque les serveurs
# GitHub : ses tableaux viennent du dernier instantané poussé depuis le Mac (`npm run snapshot -- --push`).
name: Simulations du jour
on:
  schedule:
    - cron: '7 15 * * *'   # 17 h Paris : blessures et cotes du matin US
    - cron: '7 21 * * *'   # 23 h Paris : statuts de dernière minute, avant le premier match
  workflow_dispatch:
    inputs:
      date:
        description: 'Date des matchs (AAAA-MM-JJ, heure US). Vide = aujourd''hui.'
        required: false
concurrency: { group: daily-sims, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  sims:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SIMLAB_OFFLINE_HOSTS: stats.nba.com
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Play-by-play déjà téléchargé (~2 600 matchs) : gardé d'un jour à l'autre.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: nba-cache-${{ github.run_id }}
          restore-keys: nba-cache-
      - run: npm run snapshot -- --pull
      - run: npm run ingest -- --games
      - name: Simulations
        run: |
          DATE="${{ inputs.date }}"
          [ -n "$DATE" ] || DATE=$(TZ=America/New_York date +%F)
          npm run slate -- --date "$DATE"
      - run: npm run publish-site
      - name: Publication
        run: |
          git config user.name "simbet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-data
          git diff --cached --quiet && { echo "Rien de nouveau."; exit 0; }
          git commit -m "Simulations du $(TZ=America/New_York date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
