# Données foot tenues à jour toutes les heures : nouveaux matchs joués (fiches FotMob : xG, tirs, compositions),
# calendriers, cotes football-data de la saison, puis programme des prochains jours (slate.json) que l'app lit. Le tout
# repoussé sur la branche donnees-foot (archive seule, sans historique).
name: Données foot
on:
  schedule: [{ cron: '41 * * * *' }]
  workflow_dispatch:
concurrency: { group: donnees-foot, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Données précédentes
        run: node src/cli/footsnap.ts --pull
      - name: Cotes football-data de la saison en cours
        run: |
          s=$(node -e "const d=new Date(),y=d.getUTCFullYear()%100,m=d.getUTCMonth();const a=m>=6?y:y-1;console.log(String(a).padStart(2,'0')+String(a+1).padStart(2,'0'))")
          for c in E0 SP1 I1 D1 F1 N1 P1 B1 SC0 T1 G1; do curl -sfL -m 60 -o "data/cache/foot/fd/${c}_$s.csv" "https://football-data.co.uk/mmz4281/$s/$c.csv" || echo "cotes $c non relues"; done
      - name: Nouveaux matchs joués
        run: |
          node src/cli/footingest.ts --main --from 2020 --concurrency 3
          node src/cli/footingest.ts --others --from 2023 --concurrency 3 || echo "autres championnats non relus"
      - name: Programme et publication
        run: |
          git config user.name "simbet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node src/cli/footslate.ts data/slate.json
          node src/cli/footsnap.ts --push --slate data/slate.json
