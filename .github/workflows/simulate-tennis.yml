# Simulation d'un match ATP à la demande, déclenchée par le bouton « Simuler » de l'onglet Tennis (api/tennis.ts).
# Lit la fiche de cotes Pinnacle (branche cotes-tennis) et l'historique TennisMyLife ; publie tennis/sims/<id>.json sur
# la branche resultats, que l'app lit directement.
name: Simulation tennis
run-name: "Tennis ${{ inputs.id }} ${{ inputs.day }} · ${{ inputs.request_id }}"
on:
  workflow_dispatch:
    inputs:
      id: { description: 'Identifiant Pinnacle du match', required: true }
      day: { description: 'Jour du match (AAAA-MM-JJ, UTC) : fichier de cotes', required: true }
      request_id: { description: "Identifiant de la demande (suivi depuis l'app)", required: false, default: manuel }
concurrency: { group: "tennis-${{ inputs.id }}", cancel-in-progress: false }
permissions: { contents: write }
jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ID: ${{ inputs.id }}
      DAY: ${{ inputs.day }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      # Historique TennisMyLife et photos : gardés d'une simulation à l'autre (années passées téléchargées une fois).
      - uses: actions/cache@v4
        with:
          path: data/cache/tennis
          key: tennis-cache-${{ github.run_id }}
          restore-keys: tennis-cache-
      - name: Cotes du jour
        run: git fetch origin cotes-tennis && git worktree add ../cotes FETCH_HEAD
      - run: node src/cli/tennissim.ts --id "$ID" --day "$DAY" --cotes ../cotes --out out/tennis
      - name: Publication sur la branche resultats
        run: |
          git config user.name "simbet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin resultats; then git worktree add -B resultats ../res FETCH_HEAD; else git worktree add --orphan -b resultats ../res; fi
          for i in $(seq 1 12); do
            mkdir -p ../res/tennis/sims
            cp "out/tennis/$ID.json" "../res/tennis/sims/$ID.json"
            node src/cli/tennisindex.ts ../res/tennis "$ID"
            git -C ../res add tennis
            git -C ../res commit -qm "Simulation tennis $ID"
            git -C ../res push origin HEAD:resultats && exit 0
            sleep $((i + RANDOM % 6))
            git -C ../res fetch origin resultats && git -C ../res reset -q --hard FETCH_HEAD
          done
          exit 1
