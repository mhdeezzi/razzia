# Bilan des simulations publiées (valeur de clôture, résultats), tous les quarts d'heure : sims/bilan.json sur la branche resultats.
name: Bilan des simulations
on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
concurrency: { group: bilan, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  bilan:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Calcul et publication
        run: |
          git config user.name "simbet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Historique de la saison : une relance publiée après le coup d'envoi est remplacée par la version d'avant-match.
          git fetch --shallow-since="$(date -u -d '150 days ago' +%F)" origin resultats && git worktree add -B resultats ../res FETCH_HEAD
          for i in 1 2 3; do
            node src/cli/bilan.ts ../res/sims
            git -C ../res add sims/bilan.json
            git -C ../res commit -qm "Bilan des simulations" || exit 0
            git -C ../res push origin HEAD:resultats && exit 0
            sleep $((i * 3))
            git -C ../res fetch origin resultats && git -C ../res reset -q --hard FETCH_HEAD
          done
          exit 1
